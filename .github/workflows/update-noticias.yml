name: Atualizar notícias

on:
  schedule:
    # a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar feeds e gerar noticias.json
        run: node scripts/build-noticias.mjs

      - name: Commitar se houve mudança
        run: |
          if git diff --quiet -- assets/data/noticias.json; then
            echo "Sem mudanças nas notícias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/noticias.json
          git commit -m "chore: atualizar noticias.json automaticamente"
          git push
